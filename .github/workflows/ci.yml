name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh gawk make
      - name: Install ble.sh
        run: |
          git clone --depth 1 https://github.com/akinomyoga/ble.sh /tmp/ble.sh
          make -C /tmp/ble.sh -f GNUmakefile install PREFIX="$HOME/.local"
          test -r "$HOME/.local/share/blesh/ble.sh"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all --locked
      - run: zsh -n shell/adaptive.zsh
      - run: bash -n shell/adaptive.bash
      - run: bash -n shell/adaptive.blesh
      - run: bash -n shell/adaptive-core.bash
      - run: sh -n install.sh && sh -n uninstall.sh
      - run: ./tests/install.sh
      - run: bash tests/frontend.bash
      # The Bash frontends only mean anything inside a real terminal, so they
      # are driven through a pseudo-terminal: ten fresh shells, the inline
      # suggestion, the arrow keys, and both the ble.sh and the Readline
      # backends.
      - run: python3 tests/blesh_pty.py
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan the whole history for credentials
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --config .gitleaks.toml
