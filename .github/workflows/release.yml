name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          archive="adaptive-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$archive" adaptive
          if command -v shasum >/dev/null; then
            shasum -a 256 "$archive" | awk '{print $1 "  " $2}' > "$archive.sha256"
          else
            sha256sum "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: adaptive-${{ matrix.target }}
          path: |
            adaptive-${{ matrix.target }}.tar.gz
            adaptive-${{ matrix.target }}.tar.gz.sha256
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        run: cat dist/*.sha256 > dist/checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --verify-tag --generate-notes --title "Adaptive $GITHUB_REF_NAME"
